name: webhook-relay

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay"]
      interval: 3s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20

  api:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["api"]
    environment: &relayenv
      RELAY_DATABASE_URL: postgres://relay:relay@db:5432/relay
      RELAY_REDIS_URL: redis://redis:6379/0
      RELAY_ADMIN_API_KEY: dev-admin-key
      RELAY_ALLOW_PRIVATE_DESTINATIONS: "true"   # demo receiver lives on this network
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  worker:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["worker"]
    environment: *relayenv
    deploy: { replicas: 2 }
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  sweeper:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["sweep"]
    environment: *relayenv
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

  demo-receiver:
    build: { context: .., dockerfile: deploy/Dockerfile }
    entrypoint: ["demo-receiver"]
    environment:
      PORT: "9090"
      FAIL_RATE: "0.2"
      MAX_DELAY_MS: "200"
    ports: ["9090:9090"]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes: ["./otel-collector.yaml:/etc/otel/config.yaml:ro,z"]

  tempo:
    image: grafana/tempo:2.6.0
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: ["./tempo.yaml:/etc/tempo.yaml:ro,z"]

  prometheus:
    image: prom/prometheus:v2.54.0
    volumes: ["./prometheus.yml:/etc/prometheus/prometheus.yml:ro,z"]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports: ["3000:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro,z
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro,z

volumes:
  pgdata:
